name: Testes SAST e publicacao no S3

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install semgrep

      - name: Executar testes
        run: python -m unittest discover -s tests -v

      - name: Analisar código com Semgrep
        run: semgrep scan --config p/python --error app.py

      - name: Preparar pacote para EC2
        run: |
          mkdir -p build/pacote/wheelhouse
          cp app.py index.html requirements.txt build/pacote/
          python -m pip download \
            --requirement requirements.txt \
            --dest build/pacote/wheelhouse \
            --only-binary=:all: \
            --platform manylinux2014_x86_64 \
            --python-version 3.12 \
            --implementation cp \
            --abi cp312

      - name: Compactar pacote
        run: |
          tar -czf "build/trabalho-fabiano-${{ github.sha }}.tar.gz" \
            -C build/pacote .
          tar -tzf "build/trabalho-fabiano-${{ github.sha }}.tar.gz"

      - name: Disponibilizar pacote no GitHub
        uses: actions/upload-artifact@v7
        with:
          name: pacote-aplicacao
          path: build/trabalho-fabiano-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publicar_s3:
    needs: verificar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      AWS_REGION: us-east-1
      BUCKET_PACOTES: trabalho-fabiano-pacotes-78c742d5fab4b9ca4a481405fd

    steps:
      - name: Baixar pacote aprovado
        uses: actions/download-artifact@v8
        with:
          name: pacote-aplicacao
          path: pacote

      - name: Configurar acesso a AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
          allowed-account-ids: "377185077880"

      - name: Enviar pacote ao S3
        run: |
          ARQUIVO="trabalho-fabiano-${GITHUB_SHA}.tar.gz"
          aws s3 cp "pacote/$ARQUIVO" "s3://$BUCKET_PACOTES/$ARQUIVO"
          aws s3api head-object \
            --bucket "$BUCKET_PACOTES" \
            --key "$ARQUIVO"

      - name: Testar acesso a EC2 pelo SSM
        run: |
          INSTANCIA="i-0224e7568454d2701"

          COMANDO_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCIA" \
            --document-name "AWS-RunShellScript" \
            --comment "Verificar aplicacao pelo GitHub Actions" \
            --parameters '{"commands":["set -eu","systemctl is-active fabiano","curl --fail --show-error http://127.0.0.1:8000/health"]}' \
            --query "Command.CommandId" \
            --output text)

          FALHOU=0
          aws ssm wait command-executed \
            --command-id "$COMANDO_ID" \
            --instance-id "$INSTANCIA" || FALHOU=1

          aws ssm get-command-invocation \
            --command-id "$COMANDO_ID" \
            --instance-id "$INSTANCIA" \
            --query '{Status:Status,Saida:StandardOutputContent,Erro:StandardErrorContent}'

          test "$FALHOU" -eq 0