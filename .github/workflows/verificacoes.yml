name: Testes seguranca e publicacao na EC2

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Procurar credenciais expostas com Gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks/pacote.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$RUNNER_TEMP/gitleaks/pacote.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks/pacote.tar.gz" \
            -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" git \
            --redact --no-banner --verbose --log-opts="--all" .

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep pip-audit
          python -m venv "$RUNNER_TEMP/fabiano-app"
          "$RUNNER_TEMP/fabiano-app/bin/python" -m pip install -r requirements.txt
          "$RUNNER_TEMP/fabiano-app/bin/python" -m pip freeze > requirements.lock.txt

      - name: Auditar dependencias com pip-audit
        run: python -m pip_audit --requirement requirements.lock.txt --strict

      - name: Conferir script de publicacao
        run: |
          sed -i 's/\r$//' deploy.sh
          bash -n deploy.sh

      - name: Executar testes
        run: '"$RUNNER_TEMP/fabiano-app/bin/python" -m unittest discover -s tests -v'

      - name: Analisar codigo com Semgrep
        run: semgrep scan --config p/python --error app.py

      - name: Preparar pacote para EC2
        run: |
          mkdir -p build/pacote/wheelhouse
          cp app.py index.html deploy.sh build/pacote/
          cp requirements.lock.txt build/pacote/requirements.txt
          printf '%s\n' "$GITHUB_SHA" > build/pacote/VERSION
          python -m pip download \
            --requirement requirements.lock.txt \
            --dest build/pacote/wheelhouse \
            --only-binary=:all: \
            --platform manylinux2014_x86_64 \
            --python-version 3.12 \
            --implementation cp \
            --abi cp312

      - name: Compactar pacote
        run: |
          tar -czf "build/trabalho-fabiano-${{ github.sha }}.tar.gz" \
            -C build/pacote .
          tar -tzf "build/trabalho-fabiano-${{ github.sha }}.tar.gz"

      - name: Disponibilizar pacote no GitHub
        uses: actions/upload-artifact@v7
        with:
          name: pacote-aplicacao
          path: build/trabalho-fabiano-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publicar_s3:
    needs: verificar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    concurrency:
      group: fabiano-producao
      cancel-in-progress: false

    env:
      AWS_REGION: us-east-1
      BUCKET_PACOTES: trabalho-fabiano-pacotes-78c742d5fab4b9ca4a481405fd
      INSTANCIA: i-0224e7568454d2701

    steps:
      - name: Baixar pacote aprovado
        uses: actions/download-artifact@v8
        with:
          name: pacote-aplicacao
          path: pacote

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Configurar acesso a AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
          allowed-account-ids: "377185077880"

      - name: Enviar pacote ao S3
        run: |
          ARQUIVO="trabalho-fabiano-$GITHUB_SHA.tar.gz"
          aws s3 cp "pacote/$ARQUIVO" "s3://$BUCKET_PACOTES/$ARQUIVO"
          aws s3api head-object \
            --bucket "$BUCKET_PACOTES" \
            --key "$ARQUIVO"

      - name: Preparar comando de publicacao
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import shlex
          from pathlib import Path

          versao = os.environ["GITHUB_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", versao):
              raise SystemExit("Commit invalido")

          arquivo = f"trabalho-fabiano-{versao}.tar.gz"
          origem = f"s3://{os.environ['BUCKET_PACOTES']}/{arquivo}"
          pacote = f"/tmp/{arquivo}"
          script = f"/tmp/fabiano-deploy-{versao}.sh"
          q = shlex.quote

          comandos = [
              "set -eu",
              f"aws s3 cp {q(origem)} {q(pacote)} --region us-east-1",
              f"tar -xOf {q(pacote)} ./deploy.sh > {q(script)}",
              f"flock -w 60 /var/lock/fabiano-deploy.lock bash {q(script)} {q(pacote)} {q(versao)}",
          ]
          parametros = {"commands": comandos, "executionTimeout": ["600"]}
          Path("comando-ssm.json").write_text(json.dumps(parametros))
          PY

      - name: Atualizar aplicacao na EC2 pelo SSM
        run: |
          COMANDO_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCIA" \
            --document-name "AWS-RunShellScript" \
            --comment "Publicacao pelo GitHub Actions" \
            --timeout-seconds 120 \
            --parameters file://comando-ssm.json \
            --query "Command.CommandId" \
            --output text)

          echo "Comando SSM: $COMANDO_ID"
          STATUS="Pending"

          for TENTATIVA in $(seq 1 144); do
            if STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMANDO_ID" \
              --instance-id "$INSTANCIA" \
              --query Status --output text 2>ssm-status.err); then
              case "$STATUS" in
                Success|Cancelled|Cancelling|TimedOut|Failed) break ;;
              esac
            elif grep -q "InvocationDoesNotExist" ssm-status.err; then
              STATUS="Pending"
            else
              cat ssm-status.err >&2
              exit 1
            fi
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMANDO_ID" \
            --instance-id "$INSTANCIA" \
            --query '{Status:Status,Saida:StandardOutputContent,Erro:StandardErrorContent}'

          if [ "$STATUS" != "Success" ]; then
            echo "Publicacao nao concluida com sucesso: $STATUS"
            exit 1
          fi
