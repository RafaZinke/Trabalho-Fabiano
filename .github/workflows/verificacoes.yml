name: Testes e SAST

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install semgrep

      - name: Executar testes
        run: python -m unittest discover -s tests -v

      - name: Analisar código com Semgrep
        run: semgrep scan --config p/python --error app.py

      - name: Preparar pacote para EC2
        run: |
          mkdir -p build/pacote/wheelhouse
          cp app.py index.html requirements.txt build/pacote/
          python -m pip download \
            --requirement requirements.txt \
            --dest build/pacote/wheelhouse \
            --only-binary=:all: \
            --platform manylinux2014_x86_64 \
            --python-version 3.12 \
            --implementation cp \
            --abi cp312

      - name: Compactar pacote
        run: |
          tar -czf "build/trabalho-fabiano-${{ github.sha }}.tar.gz" \
            -C build/pacote .
          tar -tzf "build/trabalho-fabiano-${{ github.sha }}.tar.gz"

      - name: Disponibilizar pacote no GitHub
        uses: actions/upload-artifact@v4
        with:
          name: pacote-aplicacao
          path: build/trabalho-fabiano-*.tar.gz
          if-no-files-found: error
          retention-days: 7